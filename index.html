<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gurjot & Hineet – Premium Cinematic Royal Wedding Invitation</title>
  <meta name="description"
    content="You are cordially invited to the Anand Karaj of Gurjot and Hineet. Celebrate this royal union with us in deep cinematic palace harmony.">
  <link rel="stylesheet" href="styles.css">
  <link rel="shortcut icon" href="framerusercontent.com/images/vqNg8mNroPNlpAOMAK02feK2gc.png" type="image/png">
</head>

<body>

  <!-- Audio Player (We will trigger procedural Web Audio API Drone in app.js if clicked) -->
  <button class="music-toggle" id="audio-btn" aria-label="Toggle Atmosphere Music" title="Toggle Atmosphere Music">
    <svg id="audio-icon-play" viewBox="0 0 24 24" class="icon">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
    </svg>
    <svg id="audio-icon-pause" viewBox="0 0 24 24" class="icon" style="display:none;">
      <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
    </svg>
  </button>

  <!-- Smooth Snap Container -->
  <main class="smooth-container">

    <!-- Fullscreen Hero Section -->
    <section class="hero-section" id="hero">

      <!-- Parallax Background Palace canopy -->
      <div class="hero-bg-container">
        <div class="hero-bg" id="hero-palace-bg"></div>
      </div>

      <!-- Depth-of-Field Overlay Vignette and Gradients -->
      <div class="hero-overlay-sunset"></div>
      <div class="hero-overlay-radial"></div>

      <!-- Background Lantern Canvas (floating behind names) -->
      <canvas id="bg-lanterns" class="lantern-canvas"></canvas>

      <!-- Center Typography Composition -->
      <div class="hero-content" id="hero-text-content">

        <!-- Sacred Sikh Ek Onkar Cap symbol -->
        <span class="holy-symbol" id="hero-symbol">ੴ</span>

        <p class="welcome-text" id="hero-welcome">With Blessings of Almighty</p>

        <div class="names-wrapper">
          <h1 class="name-line" id="name-groom">Gurjot</h1>

          <div class="weds-divider" id="hero-weds">
            <span class="weds-line"></span>
            <span class="weds-text">weds</span>
            <span class="weds-line"></span>
          </div>

          <h1 class="name-line" id="name-bride">Hineet</h1>
        </div>

        <!-- Premium Handcrafted Divider -->
        <div class="ornamental-divider" id="hero-divider"></div>

        <!-- Ceremony details in warm ivory/gold -->
        <div class="ceremony-details" id="hero-details">
          <h2 class="ceremony-title">Anand Karaj</h2>
          <p class="ceremony-info">Friday, March 9th, 2026</p>
          <p class="ceremony-info">Taj Exotica Resort, Goa</p>
        </div>

      </div>

      <!-- Foreground Lantern Canvas (floating in front of text for 3D bokeh blur effect) -->
      <canvas id="fg-lanterns" class="lantern-canvas"></canvas>

      <!-- Pulse gold scroll indicator -->
      <div class="scroll-indicator" id="hero-scroll"
        onclick="document.getElementById('hero').nextElementSibling?.scrollIntoView({ behavior: 'smooth' });">
        <span class="scroll-text">Begin The Journey</span>
        <svg class="scroll-arrow" viewBox="0 0 24 24">
          <path d="M7 13l5 5 5-5M12 6v12" />
        </svg>
      </div>

    </section>

  </main>

  <!-- Load GSAP & ScrollTrigger with local/CDN configurations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <!-- Fallback script checks to guarantee GSAP works offline/offline-scraped -->
  <script>
    if (typeof gsap === 'undefined') {
      document.write('<script src="https://unpkg.com/gsap@3.12.2/dist/gsap.min.js"><\/script>');
    }
  </script>

  <script src="app.js"></script>
</body>

</html>
